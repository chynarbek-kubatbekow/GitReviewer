telegram_notify_gitlab:
  stage: notify
  image: curlimages/curl:8.8.0
  entrypoint: [""]
  allow_failure: true
  script:
    - |
      case "$CI_JOB_STATUS" in
        failed) STATUS="failed" ;;
        *) STATUS="success" ;;
      esac

      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        TITLE="$CI_MERGE_REQUEST_TITLE"
        SOURCE_BRANCH="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        TARGET_BRANCH="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        MERGE_REQUEST_URL="$CI_MERGE_REQUEST_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID"
      else
        TITLE="$CI_COMMIT_TITLE"
        SOURCE_BRANCH="$CI_COMMIT_BRANCH"
        TARGET_BRANCH="$CI_COMMIT_BRANCH"
        MERGE_REQUEST_URL=""
      fi

      curl -sS -X POST "$TELEGRAM_NOTIFY_URL/api/telegram/gitlab/merge-request" \
        -H "x-webhook-secret: $TELEGRAM_NOTIFY_SECRET" \
        -d "jobStatus=$STATUS" \
        --data-urlencode "jobName=$CI_JOB_NAME" \
        --data-urlencode "serviceName=${SERVICE_NAME:-$CI_PROJECT_NAME}" \
        --data-urlencode "mergeRequestTitle=$TITLE" \
        --data-urlencode "branchName=$CI_COMMIT_BRANCH" \
        --data-urlencode "sourceBranch=$SOURCE_BRANCH" \
        --data-urlencode "targetBranch=$TARGET_BRANCH" \
        --data-urlencode "author=$GITLAB_USER_NAME" \
        --data-urlencode "telegramUsers=$TELEGRAM_USERS" \
        --data-urlencode "mergeRequestUrl=$MERGE_REQUEST_URL" \
        --data-urlencode "commitTitle=$CI_COMMIT_TITLE" \
        --data-urlencode "commitShortSha=$CI_COMMIT_SHORT_SHA" \
        --data-urlencode "commitUrl=$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA" \
        --data-urlencode "pipelineUrl=$CI_PIPELINE_URL" || true
  rules:
    - if: >
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(test|dev|main|master)$/
    - if: >
        $CI_PIPELINE_SOURCE == "push" &&
        $CI_COMMIT_BRANCH =~ /^(test|dev|main|master)$/
